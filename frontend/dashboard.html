<!DOCTYPE html>

  <style>

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar { background-color: #661c1c !important; }
    
    /* Cores personalizadas para cada grupo de botões */
    .btn-principal {

    .btn-principal:hover {

    .btn-funcionario {
      background-color: #18181b !important;

      </div>
      <div class="col-md-4">

      </div>
      <div class="col-md-4">
        <a href="senioridade.html" class="btn btn-config w-100 py-3 fs-5">Senioridade</a>

      <div class="col-md-4">

      </div>
      <div class="col-md-4">

    protegerPagina()   // o dashboard também é protegido — sem login, não entra
