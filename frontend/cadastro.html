<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♱</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffe6de;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-cadastro {
      background: #ffffff;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
    }
    .btn-primary { background-color: #661c1c !important; border-color: #661c1c !important; }
    .btn-primary:hover { background-color: #521616 !important; border-color: #521616 !important; }
  </style>
</head>
<body>

  <div class="card-cadastro">
    <h1 class="mb-4 text-center h3 fw-bold text-dark">Criar conta</h1>

    <form id="form-cadastro">
      <div class="mb-3">
        <input type="text" id="nome" class="form-control py-2" placeholder="Nome" required>
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control py-2" placeholder="E-mail" required>
      </div>
      <div class="mb-3">
        <input type="password" id="senha" class="form-control py-2" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Cadastrar</button>
    </form>

    <p class="mt-4 text-center mb-0 text-muted">
      Já tem conta? <a href="login.html" class="text-decoration-none fw-semibold" style="color: #661c1c;">Entrar</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
